# Builds and publishes a release when a version tag is pushed, on the commit
# that sets pubspec.yaml's version to the tag's (1.2.0+<build>):
#
#   git tag -a v1.2.0 -m v1.2.0 && git push origin v1.2.0
#
# The release skill (/release, .agents/skills/release) does all of it.
#
# The release gets zml-lab-macos.tar.gz and its signature, which installed
# apps pick up (lib/features/updates), and ZML-Lab.dmg for a first install.
# The app is code-signed with the release certificate (tool/macos_sign.sh), so
# macOS keeps its permissions across updates. Needs the ZML_LAB_UPDATE_KEY,
# ZML_LAB_CODESIGN_P12 and ZML_LAB_CODESIGN_PASSWORD secrets and the pinned
# perf benchmarker library (native/libzmlbench.dylib.sha256, see
# native/README.md).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the tag
        run: |
          version=${GITHUB_REF_NAME#v}
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tags are v<major>.<minor>.<patch>, not $GITHUB_REF_NAME"
            exit 1
          fi
          # The bundle's version and build number are pubspec's.
          pubspec=$(sed -n 's/^version: *//p' pubspec.yaml)
          if [ "${pubspec%%+*}" != "$version" ]; then
            echo "::error::$GITHUB_REF_NAME doesn't match pubspec.yaml's version, $pubspec"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Fetch the perf benchmarker library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(cat native/libzmlbench.dylib.sha256)
          gh release download zmlbench --pattern "libzmlbench-$(echo "$sha" | cut -c1-12).dylib" --output native/libzmlbench.dylib
          echo "$sha  native/libzmlbench.dylib" | shasum -a 256 -c

      # Exactly the versions and content hashes in pubspec.lock, or fail.
      - run: flutter pub get --enforce-lockfile

      - name: Build
        run: >-
          flutter build macos --release
          --dart-define=ZML_LAB_VERSION="$VERSION"

      - name: Code-sign
        env:
          ZML_LAB_CODESIGN_P12: ${{ secrets.ZML_LAB_CODESIGN_P12 }}
          ZML_LAB_CODESIGN_PASSWORD: ${{ secrets.ZML_LAB_CODESIGN_PASSWORD }}
        run: tool/macos_sign.sh build/macos/Build/Products/Release/ZML-Lab.app

      - name: Package and sign
        env:
          ZML_LAB_UPDATE_KEY: ${{ secrets.ZML_LAB_UPDATE_KEY }}
        run: |
          # COPYFILE_DISABLE: no ._ AppleDouble files in the archive.
          COPYFILE_DISABLE=1 tar -czf zml-lab-macos.tar.gz -C build/macos/Build/Products/Release ZML-Lab.app
          dart run tool/update_signing.dart sign "$VERSION" zml-lab-macos.tar.gz > zml-lab-macos.tar.gz.sig
          tool/macos_dmg.sh build/macos/Build/Products/Release/ZML-Lab.app ZML-Lab.dmg

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          zml-lab-macos.tar.gz zml-lab-macos.tar.gz.sig ZML-Lab.dmg
          --title "ZML-Lab $VERSION"
          --generate-notes
          --verify-tag
